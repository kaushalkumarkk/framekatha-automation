name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: framekatha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/framekatha
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/framekatha_test
      API_KEY: ci-only-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          grep -viE '^pgserver' requirements-dev.lock > /tmp/req.txt
          pip install -r /tmp/req.txt
          pip install --no-deps -e .
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE framekatha_test;"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
