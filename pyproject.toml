[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framekatha-automation"
version = "0.1.0"
description = "Frame Katha Studio automation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "phonenumbers>=9,<10", "rapidfuzz>=3.11,<4",
  "redis>=5,<7", "rq>=2,<3",
  "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "PyYAML>=6,<7",
  "playwright>=1.50,<2", "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
local = ["pgserver==0.1.4"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "leads*", "scrapers*", "talent*", "ai*", "invoicing*", "frontend*"]

[tool.setuptools.package-data]
ai = ["prompts/*.txt"]
scrapers = ["*.yaml"]
api = ["static/*"]
frontend = ["index.html", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated local PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
